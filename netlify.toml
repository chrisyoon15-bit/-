# Netlify 배포 설정 — 빌드 과정 없는 정적 사이트
# 저장소를 Netlify 에 연결하면 이 파일을 자동으로 읽습니다.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# 해시 없는 파일명이므로 캐시를 짧게 두고, 배포 후 바로 반영되게 합니다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# /index.html 로 들어온 요청을 / 로 정리
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
